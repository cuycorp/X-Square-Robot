<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Mic</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --accent:#2f6fde; --stop:#c8412f; --bar:#e2e2dd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#f0f0ec; --muted:#9a9a94; --bar:#2c2c2a; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.4 -apple-system, system-ui, sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 28px; text-align:center; }
  button { width:180px; height:180px; border-radius:50%; border:0; font-size:22px; font-weight:600;
           color:#fff; background:var(--accent); -webkit-tap-highlight-color:transparent; }
  button.on { background:var(--stop); }
  .meter { width:240px; height:10px; background:var(--bar); border-radius:5px; margin-top:28px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--accent); transition:width 60ms; }
  #status { margin-top:16px; font-size:15px; color:var(--muted); min-height:1.4em; text-align:center; }
</style>
</head>
<body>
  <h1>iPhone Mic</h1>
  <p>Streams this phone's microphone to the computer.<br>Keep this page open with the screen on.</p>
  <button id="btn">Start</button>
  <div class="meter"><i id="lvl"></i></div>
  <div id="status">Idle</div>
<script>
const btn = document.getElementById('btn'), lvl = document.getElementById('lvl'), st = document.getElementById('status');
let ctx, stream, ws, node, wake;

async function start() {
  st.textContent = 'Requesting microphone…';
  stream = await navigator.mediaDevices.getUserMedia({ audio: {
    echoCancellation: false, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  ws = new WebSocket(`wss://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { ws.send('rate:' + ctx.sampleRate); st.textContent = `Streaming · ${ctx.sampleRate} Hz`; };
  ws.onclose = () => { if (btn.classList.contains('on')) { stop(); st.textContent = 'Disconnected — tap Start to reconnect'; } };
  const src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(2048, 1, 1);
  node.onaudioprocess = e => {
    const f = e.inputBuffer.getChannelData(0), out = new Int16Array(f.length);
    let peak = 0;
    for (let i = 0; i < f.length; i++) {
      const s = Math.max(-1, Math.min(1, f[i])); out[i] = s * 0x7fff;
      const a = s < 0 ? -s : s; if (a > peak) peak = a;
    }
    lvl.style.width = Math.min(100, peak * 140) + '%';
    if (ws.readyState === 1 && ws.bufferedAmount < 64000) ws.send(out.buffer);
  };
  src.connect(node); node.connect(ctx.destination);
  try { wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  btn.textContent = 'Stop'; btn.classList.add('on');
}

function stop() {
  btn.textContent = 'Start'; btn.classList.remove('on'); lvl.style.width = '0';
  try { node && node.disconnect(); } catch (_) {}
  stream && stream.getTracks().forEach(t => t.stop());
  ctx && ctx.close(); ws && ws.readyState <= 1 && ws.close();
  wake && wake.release && wake.release();
  st.textContent = 'Stopped';
}

btn.onclick = () => btn.classList.contains('on') ? stop()
  : start().catch(e => { st.textContent = 'Error: ' + e.message; stop(); st.textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
